spring:
  application:
    name: healthcare-hms
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # P3.1 — datasource, JPA and Flyway (D7: HMS_DB_* env naming, mirrors HMS_JWT_SECRET).
  # The password is required in the prod profile (DataSourceSecretValidator fail-fast);
  # local dev reads it from infra/.env via the environment.
  datasource:
    url: ${HMS_DB_URL:jdbc:mysql://127.0.0.1:3306/hms_dev?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${HMS_DB_USERNAME:hms}
    password: ${HMS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: 8080

  # SEC-1 (P5.11) - infra/nginx sends X-Real-IP/X-Forwarded-For, so without this every client
  # of a proxied deployment would share one rl:ip:* bucket and 20 logins would deny the whole
  # site. 'native' (Tomcat RemoteIpValve) is required: 'framework' rewrites only scheme/host/
  # port and leaves getRemoteAddr() - which is what RateLimitFilter keys on - pointing at the
  # proxy. The hop is pinned to this allowlist, so a header arriving from any other peer is
  # ignored and cannot be used to pick a bucket. Tomcat matches the pattern against the whole
  # address (Matcher.matches), hence the anchored form; an empty value trusts nobody, i.e. it
  # fails back to today's shared-bucket behaviour rather than opening a hole. Re-pin it to the
  # real proxy address for production with HMS_TRUSTED_PROXY (DEPLOYMENT section 6, P27).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${HMS_TRUSTED_PROXY:^172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}$}'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

hms:
  security:
    # Required from the environment (HMS_JWT_SECRET). Startup fails fast when
    # missing, empty or a placeholder value (see JwtSecretValidator).
    jwt-secret: ${HMS_JWT_SECRET:}
