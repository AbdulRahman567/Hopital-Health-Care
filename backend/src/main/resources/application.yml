spring:
  application:
    name: healthcare-hms
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # P3.1 — datasource, JPA and Flyway (D7: HMS_DB_* env naming, mirrors HMS_JWT_SECRET).
  # The password is required in the prod profile (DataSourceSecretValidator fail-fast);
  # local dev reads it from infra/.env via the environment.
  datasource:
    url: ${HMS_DB_URL:jdbc:mysql://127.0.0.1:3306/hms_dev?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${HMS_DB_USERNAME:hms}
    password: ${HMS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

hms:
  security:
    # Required from the environment (HMS_JWT_SECRET). Startup fails fast when
    # missing, empty or a placeholder value (see JwtSecretValidator).
    jwt-secret: ${HMS_JWT_SECRET:}
